name: Build Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32-C3 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Compile wired firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs \
            --export-binaries \
            --output-dir build/wired \
            .

      - name: Compile battery firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs \
            --export-binaries \
            --output-dir build/battery \
            firmware/CodingLightBattery

      - name: Package firmware artifacts
        run: |
          mkdir -p release/wired release/battery
          find build/wired -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) -print -exec cp {} release/wired/ \;
          find build/battery -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) -print -exec cp {} release/battery/ \;
          test -n "$(find release/wired -type f -name '*.bin' -print -quit)"
          test -n "$(find release/battery -type f -name '*.bin' -print -quit)"
          short_sha="${GITHUB_SHA::7}"
          zip -j "release/CodingLight-wired-${short_sha}.zip" release/wired/*
          zip -j "release/CodingLight-battery-${short_sha}.zip" release/battery/*
          find release -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodingLight-firmware-${{ github.sha }}
          path: release/

      - name: Update continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous --yes --cleanup-tag || true
          git tag -f continuous "$GITHUB_SHA"
          git push --force origin continuous
          gh release create continuous release/*.zip release/SHA256SUMS.txt \
            --title "Continuous Firmware Build" \
            --notes "Automated wired and battery firmware builds for commit ${GITHUB_SHA}. Both use the Minimal SPIFFS OTA partition layout and are built without local WiFi or OTA secrets." \
            --prerelease \
            --target "$GITHUB_SHA"
